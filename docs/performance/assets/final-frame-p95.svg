<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title description">
  <title id="title">CPU ×4 Medium frame p95 raw remeasurement</title>
  <desc id="description">Three weather preset frame p95 median values, before and final remeasurement. The chart explicitly notes that no runtime code changed, so raw deltas are not causal performance improvements.</desc>
  <rect width="960" height="520" fill="#08111f" rx="24"/>
  <text x="48" y="62" fill="#f8fafc" font-family="Arial, sans-serif" font-size="27" font-weight="700">CPU ×4 Medium frame p95</text>
  <text x="48" y="91" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">Actual-GPU Chrome · 1365×768 · cache disabled · 20 s · median of 3 runs</text>
  <text x="48" y="121" fill="#fbbf24" font-family="Arial, sans-serif" font-size="15" font-weight="700">No runtime rendering code changed: these raw remeasurement deltas are not attributed as optimization gains.</text>
  <g font-family="Arial, sans-serif" font-size="15">
    <rect x="48" y="152" width="14" height="14" fill="#64748b" rx="3"/><text x="70" y="164" fill="#cbd5e1">Before trace baseline</text>
    <rect x="250" y="152" width="14" height="14" fill="#22d3ee" rx="3"/><text x="272" y="164" fill="#cbd5e1">Final remeasurement</text>
  </g>
  <g stroke="#1e293b" stroke-width="1">
    <line x1="235" y1="200" x2="235" y2="455"/><line x1="405" y1="200" x2="405" y2="455"/><line x1="575" y1="200" x2="575" y2="455"/><line x1="745" y1="200" x2="745" y2="455"/>
  </g>
  <g fill="#94a3b8" font-family="Arial, sans-serif" font-size="13">
    <text x="224" y="478">0</text><text x="385" y="478">150</text><text x="555" y="478">300</text><text x="725" y="478">450 ms</text>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="48" y="224" fill="#f8fafc" font-size="21" font-weight="700">Rain</text>
    <rect x="235" y="202" width="454" height="18" fill="#64748b" rx="9"/><text x="700" y="217" fill="#cbd5e1" font-size="14">400.9 ms</text>
    <rect x="235" y="230" width="265" height="18" fill="#22d3ee" rx="9"/><text x="512" y="245" fill="#67e8f9" font-size="14">233.8 ms</text>
    <text x="790" y="229" fill="#67e8f9" font-size="18" font-weight="700">−41.7%</text>
    <text x="48" y="309" fill="#f8fafc" font-size="21" font-weight="700">Storm</text>
    <rect x="235" y="287" width="435" height="18" fill="#64748b" rx="9"/><text x="681" y="302" fill="#cbd5e1" font-size="14">383.3 ms</text>
    <rect x="235" y="315" width="245" height="18" fill="#22d3ee" rx="9"/><text x="492" y="330" fill="#67e8f9" font-size="14">216.0 ms</text>
    <text x="790" y="314" fill="#67e8f9" font-size="18" font-weight="700">−43.6%</text>
    <text x="48" y="394" fill="#f8fafc" font-size="21" font-weight="700">Snow</text>
    <rect x="235" y="372" width="510" height="18" fill="#64748b" rx="9"/><text x="756" y="387" fill="#cbd5e1" font-size="14">449.9 ms</text>
    <rect x="235" y="400" width="284" height="18" fill="#22d3ee" rx="9"/><text x="531" y="415" fill="#67e8f9" font-size="14">250.9 ms</text>
    <text x="790" y="399" fill="#67e8f9" font-size="18" font-weight="700">−44.2%</text>
  </g>
</svg>
